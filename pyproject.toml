[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gafoam"
version = "0.1.0"
description = "Desktop front-end for OpenFOAM built with PySide6"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.5",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "numpy>=1.26",
    "vtk>=9.2",
]

[project.scripts]
gafoam = "gafoam.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gafoam = ["icons/*.svg", "modules/*/icons/*.svg", "fonts/*.ttf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
